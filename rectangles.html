<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rectangles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 3 thẻ div lồng nhau: ngoài cùng > giữa > trong cùng -->
  <div class="outside">
    <div class="middle">
      <!-- &lt; và &gt; hiển thị thành ký tự < và > -->
      <div class="inner">I am heavily packed &lt;DIV&gt;</div>
    </div>
  </div>
</body>
</html>
